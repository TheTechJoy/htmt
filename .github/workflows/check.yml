name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # requirements-dev.txt includes rnc2rng, so test.py also checks that
      # htmt-1.0.rng accepts and rejects exactly what htmt-1.0.rnc does.
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/test.py
      - run: python tools/build.py --check
      - run: python tools/validate.py examples
